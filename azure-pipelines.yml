trigger:
- main

pool:
  vmImage: 'ubuntu-latest'   # REQUIRED: Linux agent so Docker can build Linux containers

variables:
- group: New variable group 27-Jul

- name: solution
  value: '**/*.sln'

- name: buildPlatform
  value: 'Any CPU'

- name: buildConfiguration
  value: 'Release'

steps:

# ---------------------------------------------------------
# ❌ REMOVED: NuGetToolInstaller + NuGetCommand
# These require Windows + Mono and FAIL on Linux.
# ---------------------------------------------------------

# ---------------------------------------------------------
# ⭐ Restore using dotnet (Linux-compatible)
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Restore packages
  inputs:
    command: 'restore'
    projects: '$(solution)'

# ---------------------------------------------------------
# Build using dotnet (Linux-compatible)
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Build solution
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration)'

# ---------------------------------------------------------
# Test + coverage
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Run tests
  inputs:
    command: 'test'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --collect "XPlat Code Coverage"'

# ---------------------------------------------------------
# Publish coverage results
# ---------------------------------------------------------
- task: PublishCodeCoverageResults@1
  displayName: Publish coverage
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
    reportDirectory: '$(Agent.TempDirectory)'

# ---------------------------------------------------------
# Publish ASP.NET Core app (Linux-ready)
# ---------------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: Publish app
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '--configuration Release --output $(build.artifactStagingDirectory)'
    zipAfterPublish: true

# ---------------------------------------------------------
# ⭐ Build Docker image for GHCR (Linux agent required)
# ---------------------------------------------------------
- task: Docker@2
  displayName: Build Docker image
  inputs:
    command: build
    Dockerfile: SampleApi/Dockerfile
    tags: |
      ghcr.io/mongolia144/sampleapi:$(Build.BuildId)

# ---------------------------------------------------------
# ⭐ Login to GHCR (using GHCR_PAT secret)
# ---------------------------------------------------------
- script: |
    echo $(GHCR_PAT) | docker login ghcr.io -u mongolia144 --password-stdin
  displayName: Login to GHCR

# ---------------------------------------------------------
# ⭐ Push Docker image to GHCR
# ---------------------------------------------------------
- task: Docker@2
  displayName: Push Docker image
  inputs:
    command: push
    tags: |
      ghcr.io/mongolia144/sampleapi:$(Build.BuildId)

# ---------------------------------------------------------
# ❌ REMOVED: AzureWebApp ZIP deployment
# Not used anymore. ACA uses containers.
# ---------------------------------------------------------

# ---------------------------------------------------------
# ⭐ Deploy container to Azure Container Apps (ACA)
# ---------------------------------------------------------
- script: |
    az containerapp update \
      --name sampleapi \
      --resource-group sampleApi_AzureDevOps_Acr_rg \
      --image ghcr.io/mongolia144/sampleapi:$(Build.BuildId) \
      --registry-server ghcr.io \
      --registry-username mongolia144 \
      --registry-password $(GHCR_PAT)
  displayName: Deploy to Azure Container Apps
